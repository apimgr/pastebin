name: Docker Build

on:
  push:
    # ALL branches
    branches: ['**']
    tags:
      - 'v*'
      - '*.*.*'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: docker-${{ gitea.ref }}
  cancel-in-progress: ${{ gitea.ref == 'refs/heads/main' || gitea.ref == 'refs/heads/master' || gitea.ref == 'refs/heads/devel' || gitea.ref == 'refs/heads/dev' || gitea.ref == 'refs/heads/beta' }}

env:
  PROJECT_NAME: pastebin
  # Registry auto-detected from Gitea instance (works with self-hosted)
  # Format: {gitea-server}/owner/repo -> extracts server for registry
  IMAGE_NAME: ${{ gitea.repository }}

jobs:
  build-standard:
    runs-on: ubuntu-26.04
    if: gitea.event_name != 'schedule'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Set registry from server URL
        run: |
          # Extract registry from Gitea server URL (works with self-hosted)
          # Example: https://git.example.com -> git.example.com
          SERVER_URL="${{ gitea.server_url }}"
          REGISTRY="${SERVER_URL#https://}"
          REGISTRY="${REGISTRY#http://}"
          echo "REGISTRY=${REGISTRY}" >> $GITEA_ENV

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.GITEA_TOKEN }}

      - name: Set build info
        run: |
          echo "COMMIT_ID=$(git rev-parse --short=7 HEAD)" >> $GITEA_ENV
          echo "YYMM=$(date +"%y%m")" >> $GITEA_ENV
          if [[ "${{ gitea.ref }}" == refs/tags/* ]]; then
            VERSION="${GITEA_REF_NAME}"
            # Strip 'v' prefix
            echo "VERSION=${VERSION#v}" >> $GITEA_ENV
            echo "IS_TAG=true" >> $GITEA_ENV
          else
            echo "VERSION=$(git rev-parse --short=7 HEAD)" >> $GITEA_ENV
            echo "IS_TAG=false" >> $GITEA_ENV
          fi
          BUILD_EPOCH=$(date -u +%s)
          echo "BUILD_EPOCH=${BUILD_EPOCH}" >> $GITEA_ENV
          echo "BUILD_DATE=$(date -u -d @${BUILD_EPOCH} +"%Y-%m-%dT%H:%M:%SZ")" >> $GITEA_ENV

      - name: Determine tags (standard)
        id: tags
        run: |
          # Use self-hosted registry URL
          TAGS="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.COMMIT_ID }}"

          if [[ "${{ env.IS_TAG }}" == "true" ]]; then
            # Release tag - version, latest, YYMM
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}"
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.YYMM }}"
          else
            # Beta branch also gets beta tag
            if [[ "${{ gitea.ref }}" == refs/heads/beta ]]; then
              TAGS="$TAGS,${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:beta"
            fi
          fi

          echo "tags=$TAGS" >> $GITEA_OUTPUT

      - name: Build and push (standard)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ env.VERSION }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            BUILD_EPOCH=${{ env.BUILD_EPOCH }}
            COMMIT_ID=${{ env.COMMIT_ID }}
          labels: |
            org.opencontainers.image.vendor=apimgr
            org.opencontainers.image.authors=apimgr
            org.opencontainers.image.title=${{ env.PROJECT_NAME }}
            org.opencontainers.image.base.name=${{ env.PROJECT_NAME }}
            org.opencontainers.image.description=${{ env.PROJECT_NAME }} - standard image (alpine)
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.revision=${{ env.COMMIT_ID }}
            org.opencontainers.image.url=${{ gitea.server_url }}/${{ gitea.repository }}
            org.opencontainers.image.source=${{ gitea.server_url }}/${{ gitea.repository }}
            org.opencontainers.image.documentation=${{ gitea.server_url }}/${{ gitea.repository }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            manifest:org.opencontainers.image.vendor=apimgr
            manifest:org.opencontainers.image.authors=apimgr
            manifest:org.opencontainers.image.title=${{ env.PROJECT_NAME }}
            manifest:org.opencontainers.image.base.name=${{ env.PROJECT_NAME }}
            manifest:org.opencontainers.image.description=${{ env.PROJECT_NAME }} - standard image (alpine)
            manifest:org.opencontainers.image.version=${{ env.VERSION }}
            manifest:org.opencontainers.image.created=${{ env.BUILD_DATE }}
            manifest:org.opencontainers.image.revision=${{ env.COMMIT_ID }}
            manifest:org.opencontainers.image.url=${{ gitea.server_url }}/${{ gitea.repository }}
            manifest:org.opencontainers.image.source=${{ gitea.server_url }}/${{ gitea.repository }}
            manifest:org.opencontainers.image.documentation=${{ gitea.server_url }}/${{ gitea.repository }}
            manifest:org.opencontainers.image.licenses=MIT

  build-devel:
    runs-on: ubuntu-26.04
    if: gitea.event_name == 'schedule' || gitea.event_name == 'workflow_dispatch' || (gitea.event_name == 'push' && !startsWith(gitea.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Set registry from server URL
        run: |
          SERVER_URL="${{ gitea.server_url }}"
          REGISTRY="${SERVER_URL#https://}"
          REGISTRY="${REGISTRY#http://}"
          echo "REGISTRY=${REGISTRY}" >> $GITEA_ENV

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.GITEA_TOKEN }}

      - name: Set build info
        run: |
          echo "COMMIT_ID=$(git rev-parse --short=7 HEAD)" >> $GITEA_ENV
          BUILD_EPOCH=$(date -u +%s)
          echo "BUILD_EPOCH=${BUILD_EPOCH}" >> $GITEA_ENV
          echo "BUILD_DATE=$(date -u -d @${BUILD_EPOCH} +"%Y-%m-%dT%H:%M:%SZ")" >> $GITEA_ENV

      - name: Build and push (devel)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.dev
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:devel
          build-args: |
            BUILD_DATE=${{ env.BUILD_DATE }}
            BUILD_EPOCH=${{ env.BUILD_EPOCH }}
            COMMIT_ID=${{ env.COMMIT_ID }}
          labels: |
            org.opencontainers.image.vendor=apimgr
            org.opencontainers.image.authors=apimgr
            org.opencontainers.image.title=${{ env.PROJECT_NAME }}
            org.opencontainers.image.base.name=${{ env.PROJECT_NAME }}
            org.opencontainers.image.description=${{ env.PROJECT_NAME }} - development image (alpine, debug mode)
            org.opencontainers.image.created=${{ env.BUILD_DATE }}
            org.opencontainers.image.revision=${{ env.COMMIT_ID }}
            org.opencontainers.image.url=${{ gitea.server_url }}/${{ gitea.repository }}
            org.opencontainers.image.source=${{ gitea.server_url }}/${{ gitea.repository }}
            org.opencontainers.image.documentation=${{ gitea.server_url }}/${{ gitea.repository }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            manifest:org.opencontainers.image.vendor=apimgr
            manifest:org.opencontainers.image.authors=apimgr
            manifest:org.opencontainers.image.title=${{ env.PROJECT_NAME }}
            manifest:org.opencontainers.image.base.name=${{ env.PROJECT_NAME }}
            manifest:org.opencontainers.image.description=${{ env.PROJECT_NAME }} - development image (alpine, debug mode)
            manifest:org.opencontainers.image.created=${{ env.BUILD_DATE }}
            manifest:org.opencontainers.image.revision=${{ env.COMMIT_ID }}
            manifest:org.opencontainers.image.url=${{ gitea.server_url }}/${{ gitea.repository }}
            manifest:org.opencontainers.image.source=${{ gitea.server_url }}/${{ gitea.repository }}
            manifest:org.opencontainers.image.documentation=${{ gitea.server_url }}/${{ gitea.repository }}
            manifest:org.opencontainers.image.licenses=MIT
