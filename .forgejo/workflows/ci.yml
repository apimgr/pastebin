name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: pastebin

jobs:
  lint:
    runs-on: ubuntu-latest
    if: gitea.event_name != 'schedule'
    container:
      image: casjaysdev/go:latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - run: go vet ./...
      - run: staticcheck ./...

  test:
    runs-on: ubuntu-latest
    if: gitea.event_name != 'schedule'
    container:
      image: casjaysdev/go:latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Run tests with coverage
        run: |
          mkdir -p "/tmp/${{ gitea.repository_owner }}"
          COVDIR=$(mktemp -d "/tmp/${{ gitea.repository_owner }}/$(basename "${{ gitea.repository }}")-XXXXXX")
          echo "COVDIR=$COVDIR" >> "$GITEA_ENV"
          go test -buildvcs=false -v -cover -timeout 30m -coverprofile="$COVDIR/coverage.out" ./...
      - name: Enforce coverage threshold
        run: |
          THRESHOLD=60
          PCT=$(go tool cover -func="$COVDIR/coverage.out" | awk '/^total:/ {gsub("%","",$3); print int($3)}')
          if [ "$PCT" -lt "$THRESHOLD" ]; then
            echo "::error::coverage $PCT% < threshold $THRESHOLD%"
            exit 1
          fi
          echo "Coverage: $PCT%"

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    if: gitea.event_name != 'schedule'
    container:
      image: casjaysdev/go:latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - run: go build -buildvcs=false -trimpath ./...

  vuln-scan:
    runs-on: ubuntu-latest
    container:
      image: casjaysdev/go:latest
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - run: govulncheck ./...

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      # Empty base/head = full-history scan (schedule runs and new-branch pushes)
      - name: Determine scan range
        id: range
        run: |
          BASE=""; HEAD=""
          if [ "${{ gitea.event_name }}" = "push" ] && [ "${{ gitea.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            BASE="${{ gitea.event.before }}"; HEAD="${{ gitea.sha }}"
          elif [ "${{ gitea.event_name }}" = "pull_request" ]; then
            BASE="${{ gitea.event.pull_request.base.sha }}"; HEAD="${{ gitea.event.pull_request.head.sha }}"
          fi
          echo "base=$BASE" >> "$GITEA_OUTPUT"
          echo "head=$HEAD" >> "$GITEA_OUTPUT"

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55  # v3.95.9
        with:
          path: ./
          base: ${{ steps.range.outputs.base }}
          head: ${{ steps.range.outputs.head }}
          extra_args: --results=verified,unknown

  workflow-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Enforce SHA-pinned third-party actions
        run: |
          # Every third-party action must be pinned to a full 40-char commit SHA
          bad=$(grep -RnE '^[[:space:]]*uses:' .github/ .gitea/ .forgejo/ 2>/dev/null | grep -vE '@[0-9a-f]{40}([[:space:]]|$)' || true)
          if [ -n "$bad" ]; then
            echo "::error::unpinned actions found:"
            echo "$bad"
            exit 1
          fi

  coverage:
    needs: [build]
    runs-on: ubuntu-latest
    if: gitea.event_name != 'schedule'
    container:
      image: casjaysdev/go:latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Generate coverage report
        run: |
          REPO_NAME=$(basename "$GITEA_REPOSITORY")
          mkdir -p "/tmp/$GITEA_REPOSITORY_OWNER"
          COVDIR=$(mktemp -d "/tmp/$GITEA_REPOSITORY_OWNER/${REPO_NAME}-XXXXXX")
          go test -buildvcs=false -v -cover -timeout 30m -coverprofile="$COVDIR/coverage.out" ./...
          go tool cover -html="$COVDIR/coverage.out" -o "$COVDIR/coverage.html"
          PCT=$(go tool cover -func="$COVDIR/coverage.out" | awk '/^total:/ {gsub("%","",$3); print int($3)}')
          echo "Total coverage: $PCT%"
          cp "$COVDIR/coverage.out" coverage.out
          cp "$COVDIR/coverage.html" coverage.html
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
          retention-days: 30

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Build image for scanning
        if: hashFiles('docker/Dockerfile') != ''
        run: docker build -t local/scan-target:ci -f docker/Dockerfile .
      - name: Scan image (Trivy)
        if: hashFiles('docker/Dockerfile') != ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: local/scan-target:ci
          exit-code: '1'
          severity: CRITICAL,HIGH

  upload-artifacts:
    needs: [build]
    runs-on: ubuntu-latest
    if: gitea.event_name != 'schedule'
    container:
      image: casjaysdev/go:latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Set build info
        run: |
          if [ -f release.txt ]; then
            echo "VERSION=$(cat release.txt)" >> "$GITEA_ENV"
          else
            echo "VERSION=devel" >> "$GITEA_ENV"
          fi
          echo "COMMIT_ID=$(git rev-parse --short=7 HEAD)" >> "$GITEA_ENV"
          BUILD_EPOCH=$(date -u +%s)
          echo "BUILD_EPOCH=${BUILD_EPOCH}" >> "$GITEA_ENV"
          echo "BUILD_DATE=$(date -u -d @${BUILD_EPOCH} +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITEA_ENV"
          # OFFICIAL_SITE (optional): site.txt wins; otherwise use repository secrets or leave empty
          # Never guess or assume - must be explicitly defined by user
          if [ -f site.txt ]; then
            echo "OFFICIAL_SITE=$(cat site.txt)" >> "$GITEA_ENV"
          else
            echo "OFFICIAL_SITE=${{ secrets.OFFICIAL_SITE }}" >> "$GITEA_ENV"
          fi
      - name: Build linux/amd64 server
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          LDFLAGS="-s -w -X 'main.Version=${{ env.VERSION }}' -X 'main.CommitID=${{ env.COMMIT_ID }}' -X 'main.BuildEpoch=${{ env.BUILD_EPOCH }}' -X 'main.OfficialSite=${{ env.OFFICIAL_SITE }}'"
          go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o pastebin-linux-amd64 ./src
      - name: Build linux/amd64 CLI
        if: hashFiles('src/client/**') != ''
        env:
          GOOS: linux
          GOARCH: amd64
        run: |
          LDFLAGS="-s -w -X 'main.Version=${{ env.VERSION }}' -X 'main.CommitID=${{ env.COMMIT_ID }}' -X 'main.BuildEpoch=${{ env.BUILD_EPOCH }}' -X 'main.OfficialSite=${{ env.OFFICIAL_SITE }}'"
          go build -buildvcs=false -trimpath -ldflags "${LDFLAGS}" -o pastebin-cli-linux-amd64 ./src/client
      - name: Upload CI binaries
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ci-binaries-${{ gitea.sha }}
          path: |
            pastebin-linux-amd64
            pastebin-cli-linux-amd64
          retention-days: 7
